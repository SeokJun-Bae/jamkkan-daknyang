name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appVersion = python -c "from dakknyang import __version__; print(__version__)"
          if ("v$appVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version v$appVersion"
          }

      - name: Build Windows executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "잠깐닦냥"
          main.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Jamkkan-Daknyang-Windows
          path: dist/잠깐닦냥.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "dist/잠깐닦냥.exe"
          --verify-tag
          --generate-notes
          --title "잠깐닦냥 $env:GITHUB_REF_NAME"
